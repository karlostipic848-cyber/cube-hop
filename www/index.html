function pick(cat, item) {
  const key = cat + ':' + item.id;
  if (save.owned.includes(key)) { save.eq[cat] = item.id; persist(); return; }
  if (save.coins >= item.price) {
    save.coins -= item.price; save.owned.push(key); save.eq[cat] = item.id;

  const kinds = [];

/* ---------- ZVUK ---------- */
let AC = null;
function sfx(type) {
  if (save.mute) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const now = AC.currentTime;
    const play = (f1, f2, dur, wave, vol) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = wave; o.frequency.setValueAtTime(f1, now);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), now + dur);
      g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(.001, now + dur);
      o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now + dur);
    };
    if (type === 'jump') play(380, 640, .12, 'square', .05);
    else if (type === 'coin') play(880, 1320, .12, 'triangle', .09);
    else if (type === 'orb') play(500, 1500, .28, 'sine', .14);
    else if (type === 'bump') play(320, 110, .2, 'sawtooth', .08);
    else if (type === 'die') play(240, 40, .5, 'sawtooth', .12);
    else if (type === 'level') play(520, 1050, .4, 'triangle', .11);
    else if (type === 'click') play(600, 500, .06, 'square', .04);
  } catch (e) {}
}
function vib(ms) { if (!save.mute && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

function spikeRow(x0, x1, w, y, h, up) {
  ctx.fillStyle = '#eef2ff'; ctx.strokeStyle = '#c0283d'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
  for (let x = x0; x < x1; x += w) {
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x + w / 2, up ? y - h : y + h); ctx.lineTo(x + w, y);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function drawSpikeStrips() {
  if (!has('spike')) return;
  const sw = 22, off = -(gx % sw) - sw;
  spikeRow(off, W + sw, sw, H - GROUND + 1, 12, true);
  spikeRow(off, W + sw, sw, -1, 12, false);
}

}

/* ---------- GRAD ---------- */
function makeCity(minW, maxW, minH, maxH) {
  const arr = []; let x = 0;
  while (x < 720) {
    let w = minW + Math.random() * (maxW - minW);
    w = Math.min(w, 720 - x);
    if (720 - x - w < 24) w = 720 - x;
    const h = minH + Math.random() * (maxH - minH);
    const cols = Math.max(1, Math.floor((w - 6) / 10)), rows = Math.max(1, Math.floor((h - 14) / 15));
    const win = []; for (let i = 0; i < cols * rows; i++) win.push(Math.random());
    arr.push({x, w, h, cols, rows, win, roof: Math.floor(Math.random() * 4), ph: Math.random() * 6});
    x += w;
  }
  return arr;
}
const cityFar = makeCity(40, 80, 130, 280);
const cityNear = makeCity(50, 92, 70, 190);

const al = v => { ctx.globalAlpha = BA * v; };

function drawCity(arr, sx, col, th, far) {
  const base = H - GROUND;
  const cw = far ? 9 : 10, ch = far ? 13 : 15, ww = far ? 3 : 5, wh = far ? 5 : 8;
  for (let rep = 0; rep < 2; rep++) {
    const off = -(sx % 720) + rep * 720;
    for (const b of arr) {
      const bx = b.x + off;
      if (bx > W || bx + b.w < 0) continue;
      const by = base - b.h;
      al(1); ctx.fillStyle = col; ctx.fillRect(bx, by, b.w, b.h);
      if (b.roof === 1) {
        ctx.fillRect(bx + b.w / 2 - 1.5, by - 18, 3, 18);
        if (!far && Math.sin(t / 20 + b.ph) > 0) { ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.arc(bx + b.w / 2, by - 19, 2.5, 0, 7); ctx.fill(); }
      } else if (b.roof === 2) {
        ctx.beginPath(); ctx.moveTo(bx - 2, by); ctx.lineTo(bx + b.w / 2, by - 16); ctx.lineTo(bx + b.w + 2, by); ctx.closePath(); ctx.fill();
      } else if (b.roof === 3) {
        ctx.fillRect(bx + b.w * .25, by - 10, b.w * .5, 10); ctx.fillRect(bx + b.w * .4, by - 16, b.w * .2, 6);
      }
      ctx.fillStyle = 'rgba(0,0,0,.13)'; ctx.fillRect(bx + b.w * .7, by, b.w * .3, b.h);
      const x0 = bx + (b.w - b.cols * cw) / 2 + (cw - ww) / 2, y0 = by + 8;
      const lit = far ? th.lit * .8 : th.lit;
      ctx.fillStyle = th.lit < .2 ? 'rgba(255,255,255,.22)' : 'rgba(0,0,0,.25)';
      for (let i = 0; i < b.win.length; i++) {
        if (b.win[i] >= lit) ctx.fillRect(x0 + (i % b.cols) * cw, y0 + Math.floor(i / b.cols) * ch, ww, wh);
      }
      ctx.fillStyle = th.win;
      for (let i = 0; i < b.win.length; i++) {
        if (b.win[i] < lit) ctx.fillRect(x0 + (i % b.cols) * cw, y0 + Math.floor(i / b.cols) * ch, ww, wh);
      }
    }
  }
}

function drawSky(th) {
  al(1);
  const g = ctx.createLinearGradient(0, 0, 0, H - GROUND);
  th.sky.forEach((c, i) => g.addColorStop(i / (th.sky.length - 1), c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (th.stars > 0) {
    ctx.fillStyle = '#fff';
    stars.forEach(s => { al(th.stars * (.35 + .4 * Math.sin(t / 18 + s.x))); ctx.beginPath(); ctx.arc(s.x, s.y * .6, s.r, 0, 7); ctx.fill(); });
  }
  const o = th.orb;
  const rg = ctx.createRadialGradient(o.x, o.y, 4, o.x, o.y, 90);
  rg.addColorStop(0, o.c); rg.addColorStop(1, 'rgba(255,255,255,0)');
  al(.45); ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(o.x, o.y, 90, 0, 7); ctx.fill();
  al(1); ctx.fillStyle = o.c; ctx.beginPath(); ctx.arc(o.x, o.y, o.t === 'sun' ? 28 : 22, 0, 7); ctx.fill();
  if (o.t === 'moon') {
    ctx.fillStyle = 'rgba(0,0,0,.09)';
    [[-7, -5, 5], [6, 4, 4], [-2, 9, 3]].forEach(c => { ctx.beginPath(); ctx.arc(o.x + c[0], o.y + c[1], c[2], 0, 7); ctx.fill(); });
  }

  al(.85); ctx.fillStyle = th.cloud;
  clouds.forEach(c => {
    const s = c.s; ctx.beginPath();
    [[0, 0, 16], [18, -8, 20], [40, 0, 16], [20, 6, 16]].forEach(k => { ctx.moveTo(c.x + k[0] * s + k[2] * s, c.y + k[1] * s); ctx.arc(c.x + k[0] * s, c.y + k[1] * s, k[2] * s, 0, 7); });
    ctx.fill();
  });

  if (th.birds) {
    al(.7); ctx.strokeStyle = '#28324f'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    birds.forEach(b => {
      const f = Math.sin(t / 4 + b.ph) * 4;
      ctx.beginPath(); ctx.moveTo(b.x - 7, b.y - f); ctx.quadraticCurveTo(b.x - 3, b.y - 4, b.x, b.y);
      ctx.quadraticCurveTo(b.x + 3, b.y - 4, b.x + 7, b.y - f); ctx.stroke();
    });
  }

  // poznata građevina grada (iza dalekog grada)
  const m = MP(), lcol = darken(th.far, .8);
  for (let rep = 0; rep < 2; rep++) {
    const lx = 330 - (sxFar % 720) + rep * 720;
    if (lx > -420 && lx < W + 420) { al(1); drawLM(m.lm, lx, H - GROUND, m.ls, lcol); }
  }

  drawCity(cityFar, sxFar, th.far, th, true);
  al(1);
  const fg = ctx.createLinearGradient(0, H - GROUND - 180, 0, H - GROUND);
  fg.addColorStop(0, 'rgba(255,255,255,0)'); fg.addColorStop(1, th.haze);
  ctx.fillStyle = fg; ctx.fillRect(0, H - GROUND - 180, W, 180);
  drawCity(cityNear, sxNear, th.near, th, false);

  const base = H - GROUND;
  for (let i = 0; i < 4; i++) {
    const lx = (((i * 190 - gx) % 760) + 760) % 760 - 40;
    if (lx > W + 30) continue;
    al(1); ctx.fillStyle = '#1c1c2e'; ctx.fillRect(lx, base - 58, 3, 58);
    ctx.fillRect(lx - 9, base - 59, 12, 3);
    rr(lx - 14, base - 61, 10, 6, 3); ctx.fill();
    if (th.lit > .3) {
      const lg = ctx.createRadialGradient(lx - 9, base - 55, 2, lx - 9, base - 55, 46);
      lg.addColorStop(0, 'rgba(255,226,138,.75)'); lg.addColorStop(1, 'rgba(255,226,138,0)');
      al(1); ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx - 9, base - 55, 46, 0, 7); ctx.fill();
    }
  }

  if (th.snow) {
    al(.9); ctx.fillStyle = '#fff';
    snow.forEach(f => { ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); });
  }
  al(1);
}

function drawGround(th) {

/* ---------- RESET / START ---------- */
function reset() {
  player = {x: 90, y: H / 2, vy: 0, size: 28, rot: 0};
  pipes = []; parts = []; floaters = []; objs = []; fx = []; hint = ''; hint2 = ''; hintT = 0;
  score = 0; runCoins = 0; level = 1; banner = 0; speed = speedFor(1); newBest = false;
  addPipe(W + 60); addPipe(W + 60 + spaceFor());
}
function addPipe(x) {
  const prev = pipes[pipes.length - 1];
  let st = false, sb = false;
  if (has('spike') && Math.random() < Math.min(.7, .35 + level * .05)) {
    const r = Math.random();
    if (r < .4) st = true; else if (r < .8) sb = true; else { st = true; sb = true; }
  }
  const gap = gapFor(level) + (st ? SPK : 0) + (sb ? SPK : 0);
  const top = 80 + Math.random() * (H - GROUND - gap - 160);
  const sTop = top + (st ? SPK : 0), sBot = top + gap - (sb ? SPK : 0);
  const p = {x, top, gap, sTop, sBot, st, sb, passed: false, taken: false, off: (Math.random() - .5) * Math.max(0, sBot - sTop - 70)};
  pipes.push(p);
  if (prev) spawnMid(prev, p);
}
reset();

function startRun() {
  save.map = mapIdx;
  save.tries[MP().id] = (save.tries[MP().id] || 0) + 1;

}
function flap() {
  if (state === 'ready') { state = 'play'; setHint(1); }

  const pcx = player.x + 14, pcy = player.y + 14;
  const o = objs.find(o => o.k === 'orb' && !o.used && Math.hypot(o.x - pcx, o.y - pcy) < o.r + 30);
  if (o) {
    o.used = true; player.vy = -10.8;
    const b = 2 * MP().cv; save.coins += b; runCoins += b;
    burst(o.x, o.y, 16, () => '#ffe066', 4);

    floaters.push({x: o.x, y: o.y - 18, t: 45, s: 'SUPER +' + b});

  } else { player.vy = JUMP; sfx('jump'); }
}
function burst(x, y, n, colorFn, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, sp = 1 + Math.random() * power, l = 28 + Math.random() * 18;
    parts.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: l, max: l, size: 3 + Math.random() * 4, c: colorFn(), g: .12});

/* ---------- POMOĆNE FUNKCIJE ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function txt(s, x, y, size, color, align, o) {
  ctx.font = 'bold ' + size + 'px "Trebuchet MS",Verdana,sans-serif';
  ctx.textAlign = align || 'center'; ctx.lineJoin = 'round';
  if (o) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(10,10,30,.55)'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color || '#fff'; ctx.fillText(s, x, y);
}
function btn(b, label, color) {
  ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(b.x, b.y + 5, b.w, b.h, 16); ctx.fill();
  ctx.fillStyle = color || '#2ee6a6'; rr(b.x, b.y, b.w, b.h, 16); ctx.fill();
  const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.45)'); g.addColorStop(.5, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; rr(b.x, b.y, b.w, b.h, 16); ctx.fill();
  txt(label, b.x + b.w / 2, b.y + b.h / 2 + 8, 22, '#10202a');
}
const hit = (x, y, b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
function star(x, y, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fill();
}
function credit(y) { txt('Developer - Stipic', W / 2, y, 15, '#ffffff', 'center', true); }

function drawCoin(x, y, r) {
  const w = Math.max(.15, Math.abs(Math.sin(t / 14)));
  ctx.fillStyle = 'rgba(255,215,0,.2)'; ctx.beginPath(); ctx.arc(x, y, r * 1.7, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffb300'; ctx.beginPath(); ctx.ellipse(x, y, r * w, r, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.ellipse(x, y, r * w * .6, r * .6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,' + (.5 + .5 * Math.sin(t / 6 + x)) + ')';
  ctx.beginPath(); ctx.arc(x + r * .5, y - r * .6, 1.8, 0, 7); ctx.fill();
}

function colorVal(id) {
  const it = SHOP.color.find(c => c.id === id) || SHOP.color[0];
  return it.val === 'rainbow' ? 'hsl(' + ((t * 4) % 360) + ',90%,60%)' : it.val;
}

function drawCube(cx, cy, s, rot, look) {
  const k = s / 28;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.save(); ctx.translate(-12 * k, 4 * k); ctx.rotate(Math.sin(t * .4) * .5 - .25);
  ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(-6 * k, 0, 9 * k, 4.5 * k, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.fillStyle = colorVal(look.color); ctx.fillRect(-14 * k, -14 * k, 28 * k, 28 * k);
  const sh = ctx.createLinearGradient(0, -14 * k, 0, 14 * k);
  sh.addColorStop(0, 'rgba(255,255,255,.4)'); sh.addColorStop(.5, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = sh; ctx.fillRect(-14 * k, -14 * k, 28 * k, 28 * k);
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 2; ctx.strokeRect(-14 * k, -14 * k, 28 * k, 28 * k);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(-11 * k, -11 * k, 7 * k, 2.5 * k);
  const eyes = () => {
    ctx.fillStyle = '#fff';
    ctx.fillRect(-10 * k, -9 * k, 8 * k, 8 * k); ctx.fillRect(2 * k, -9 * k, 8 * k, 8 * k);
    ctx.fillStyle = '#12122a';
    ctx.fillRect(-6 * k, -7 * k, 4 * k, 4 * k); ctx.fillRect(6 * k, -7 * k, 4 * k, 4 * k);
  };
  ctx.strokeStyle = '#12122a'; ctx.lineCap = 'round'; ctx.lineWidth = 2.2 * k;
  if (look.face === 'eyes') { eyes(); }
  else if (look.face === 'happy') { eyes(); ctx.beginPath(); ctx.arc(0, 3 * k, 7 * k, .15 * Math.PI, .85 * Math.PI); ctx.stroke(); }
  else if (look.face === 'cool') {
    ctx.fillStyle = '#0a0a14'; ctx.fillRect(-12 * k, -9 * k, 11 * k, 8 * k); ctx.fillRect(1 * k, -9 * k, 11 * k, 8 * k);
    ctx.fillRect(-2 * k, -8 * k, 4 * k, 2 * k);
    ctx.beginPath(); ctx.moveTo(-4 * k, 8 * k); ctx.lineTo(4 * k, 8 * k); ctx.stroke();
  } else if (look.face === 'angry') {
    eyes();
    ctx.beginPath(); ctx.moveTo(-11 * k, -12 * k); ctx.lineTo(-2 * k, -7 * k);
    ctx.moveTo(11 * k, -12 * k); ctx.lineTo(2 * k, -7 * k);
    ctx.moveTo(-5 * k, 9 * k); ctx.lineTo(5 * k, 9 * k); ctx.stroke();
  }
  if (look.hat === 'cap') {
    ctx.fillStyle = '#e03a3a'; ctx.fillRect(-12 * k, -23 * k, 24 * k, 10 * k);
    ctx.fillStyle = '#a82222'; ctx.fillRect(0, -15 * k, 20 * k, 3 * k);
  } else if (look.hat === 'top') {
    ctx.fillStyle = '#0a0a14'; ctx.fillRect(-9 * k, -32 * k, 18 * k, 19 * k); ctx.fillRect(-15 * k, -16 * k, 30 * k, 3 * k);
    ctx.fillStyle = '#d33'; ctx.fillRect(-9 * k, -21 * k, 18 * k, 3 * k);
  } else if (look.hat === 'crown') {
    ctx.fillStyle = '#ffd700'; ctx.beginPath();
    ctx.moveTo(-12 * k, -13 * k); ctx.lineTo(-12 * k, -26 * k); ctx.lineTo(-6 * k, -19 * k); ctx.lineTo(0, -29 * k);
    ctx.lineTo(6 * k, -19 * k); ctx.lineTo(12 * k, -26 * k); ctx.lineTo(12 * k, -13 * k); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e03a3a'; ctx.fillRect(-2 * k, -19 * k, 4 * k, 4 * k);
  }
  ctx.restore();
}

/* ---------- TRAGOVI ---------- */
function spawnTrail() {
  const type = save.eq.trail;
  if (type === 'none') return;
  const x = player.x, y = player.y + player.size / 2;
  if (type === 'spark') parts.push({x, y, vx: -speed * .4 - Math.random(), vy: (Math.random() - .5) * 1.5, life: 26, max: 26, size: 2 + Math.random() * 3, c: '#ffe680'});
  if (type === 'fire') parts.push({x, y, vx: -speed * .5 - Math.random(), vy: -Math.random() * 1.2, life: 22, max: 22, size: 5 + Math.random() * 5, c: 'hsl(' + (8 + Math.random() * 40) + ',100%,55%)'});
  if (type === 'rainbow') parts.push({x, y, vx: -speed, vy: 0, life: 30, max: 30, size: 7, c: 'hsl(' + ((t * 8) % 360) + ',95%,60%)'});
}

/* ---------- UPDATE ---------- */
function update() {
  t++;
  if (msgT > 0) msgT--;
  if (fade < 1) fade = Math.min(1, fade + .025);
  if (shake > .3) shake *= .88; else shake = 0;
  if (flashA > 0) flashA = Math.max(0, flashA - .05);
  if (pop > 0) pop--;

  const sc = state === 'play' ? speed : (state === 'over' ? 0 : .9);
  sxFar += sc * .12; sxNear += sc * .35; gx += sc;
  stars.forEach(s => { s.x -= s.s * (.3 + sc * .1); if (s.x < 0) s.x = W; });
  clouds.forEach(c => { c.x -= c.v + sc * .05; if (c.x < -90) { c.x = W + 60; c.y = 30 + Math.random() * 230; } });
  birds.forEach(b => { b.x -= b.v + sc * .2; if (b.x < -20) { b.x = W + 30; b.y = 60 + Math.random() * 180; } });
  snow.forEach(f => { f.y += f.vy; f.x += Math.sin(t / 30 + f.r * 5) * .4 - sc * .15; if (f.y > H) { f.y = -5; f.x = Math.random() * W; } if (f.x < -5) f.x = W + 5; });
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.g || 0; p.life--; });
  parts = parts.filter(p => p.life > 0);
  floaters.forEach(f => { f.y -= .8; f.t--; });
  floaters = floaters.filter(f => f.t > 0);
  fx.forEach(f => f.t--); fx = fx.filter(f => f.t > 0);
  if (hintT > 0) hintT--;

  if (state === 'ready') { player.y = H / 2 + Math.sin(t / 12) * 10; return; }
  if (state === 'over') {
    overT++;
    player.vy += GRAV; player.y = Math.min(player.y + player.vy, H - GROUND - player.size);
    player.rot = Math.min(1.5, player.rot + .06);
    return;
  }
  if (state !== 'play') return;

  const cvl = MP().cv;
  player.vy += GRAV; player.y += player.vy;
  player.rot = Math.max(-.5, Math.min(1, player.vy / 12));
  if (t % 2 === 0) spawnTrail();

  const lv = 1 + Math.floor(score / LEVEL_STEP);
  if (lv > level) {
    level = lv; banner = 110; save.coins += 5 * cvl; runCoins += 5 * cvl;
    setHint(lv); sfx('level');
    burst(W / 2, 260, 36, () => 'hsl(' + Math.random() * 360 + ',90%,60%)', 6);
  }
  if (banner > 0) banner--;
  speed = speedFor(level);

  pipes.forEach(p => p.x -= speed);
  if (pipes[0].x < -PIPE_W - 10) pipes.shift();
  objs.forEach(o => o.x -= speed);
  objs = objs.filter(o => o.x > -60);
  if (pipes[pipes.length - 1].x < W + 20 - spaceFor()) addPipe(W + 20);

  const px = player.x, py = player.y, s = player.size;
  for (const p of pipes) {
    if (!p.passed && p.x + PIPE_W < px) { p.passed = true; score++; pop = 10; }
    if (px + s > p.x && px < p.x + PIPE_W && (py < p.sTop || py + s > p.sBot)) { die(); return; }
    if (!p.taken) {
      const cx = p.x + PIPE_W / 2, cy = (p.sTop + p.sBot) / 2 + p.off;
      if (Math.hypot(px + s / 2 - cx, py + s / 2 - cy) < 24) {
        p.taken = true; save.coins += cvl; runCoins += cvl;
        burst(cx, cy, 10, () => '#ffd54a', 3); sfx('coin');
        floaters.push({x: cx, y: cy - 12, t: 40, s: '+' + cvl});
      }
    }
  }
  const pcx = px + s / 2, pcy = py + s / 2;
  for (const o of objs) {
    if (o.k === 'bumper') {
      if (o.sq > 0) o.sq--;
      if (o.cd > 0) o.cd--;
      else if (Math.hypot(pcx - o.x, pcy - o.y) < o.r + 14) {
        const dir = pcy < o.y ? -1 : 1;
        player.vy = dir * 9; player.y += dir * 5;
        o.sq = 10; o.cd = 14; shake = 6;
        burst(o.x, o.y, 10, () => '#ff7ae8', 3);
        sfx('bump'); vib(20);
      }
    } else if (o.k === 'saw') {
      o.y = o.y0 + Math.sin(t * o.sp + o.ph) * o.amp;
      const nx = Math.max(px, Math.min(o.x, px + s)), ny = Math.max(py, Math.min(o.y, py + s));
      if (Math.hypot(o.x - nx, o.y - ny) < o.r - 1) { die(); return; }
    }
  }
  const sp = has('spike') ? 10 : 0;
  if (py < sp || py + s > H - GROUND - sp) die();
}

/* ---------- CRTANJE ---------- */
const B = {
  play: {x: 80, y: 400, w: 200, h: 56}, shop: {x: 80, y: 472, w: 200, h: 56},
  again: {x: 48, y: 372, w: 124, h: 52}, menu: {x: 188, y: 372, w: 124, h: 52},
  back: {x: 10, y: 10, w: 70, h: 40},
  snd: {x: 10, y: 10, w: 50, h: 40}
};
const mapCard = i => ({x: 10 + (i % 2) * 177, y: 112 + Math.floor(i / 2) * 150, w: 163, h: 140});

function coinBadge() {
  ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(W - 122, 10, 112, 34, 17); ctx.fill();
  drawCoin(W - 102, 27, 11);
  txt(String(save.coins), W - 84, 35, 21, '#ffd54a', 'left');
}
function backBtn() {
  ctx.fillStyle = '#ff6b6b'; rr(B.back.x, B.back.y, B.back.w, B.back.h, 12); ctx.fill();
  txt('←', B.back.x + B.back.w / 2, B.back.y + 29, 26, '#fff');
}

function drawPlayfield(th) {
  const bot = H - GROUND + 6;
  pipes.forEach(p => {
    const by = p.top + p.gap;
    const pg = (x, w) => {
      const g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, th.p2); g.addColorStop(.28, th.p1); g.addColorStop(.42, th.cap);
      g.addColorStop(.6, th.p1); g.addColorStop(1, th.p2); return g;
    };
    ctx.fillStyle = pg(p.x, PIPE_W);
    ctx.fillRect(p.x, 0, PIPE_W, p.top); ctx.fillRect(p.x, by, PIPE_W, bot - by);
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 2;
    ctx.strokeRect(p.x, -2, PIPE_W, p.top + 2); ctx.strokeRect(p.x, by, PIPE_W, bot - by);
    ctx.fillStyle = 'rgba(0,0,0,.08)';
    for (let y = p.top - 32; y > 0; y -= 22) ctx.fillRect(p.x, y, PIPE_W, 3);
    for (let y = by + 32; y < bot; y += 22) ctx.fillRect(p.x, y, PIPE_W, 3);
    ctx.fillStyle = pg(p.x - 4, PIPE_W + 8);
    rr(p.x - 4, p.top - 22, PIPE_W + 8, 22, 6); ctx.fill(); ctx.stroke();
    rr(p.x - 4, by, PIPE_W + 8, 22, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.fillRect(p.x, p.top - 19, PIPE_W, 3); ctx.fillRect(p.x, by + 3, PIPE_W, 3);
    if (p.st) spikeRow(p.x - 4, p.x + PIPE_W + 4 - 1, (PIPE_W + 8) / 6, p.top, SPK, false);
    if (p.sb) spikeRow(p.x - 4, p.x + PIPE_W + 4 - 1, (PIPE_W + 8) / 6, by, SPK, true);
    if (!p.taken) drawCoin(p.x + PIPE_W / 2, (p.sTop + p.sBot) / 2 + p.off, 12);
  });

  drawSpikeStrips(); drawObjs(); drawFx();
  parts.forEach(p => {
    ctx.globalAlpha = p.life / p.max; ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  const gy = H - GROUND, dist = Math.max(0, Math.min(1, (gy - player.y) / 420));
  ctx.fillStyle = 'rgba(0,0,0,' + (.28 * (1 - dist)) + ')';
  ctx.beginPath(); ctx.ellipse(player.x + 14, gy + 8, 20 * (1 - dist * .6), 4, 0, 0, 7); ctx.fill();
  drawCube(player.x + player.size / 2, player.y + player.size / 2, player.size, player.rot, save.eq);

  floaters.forEach(f => { ctx.globalAlpha = Math.min(1, f.t / 20); txt(f.s, f.x, f.y, 20, '#ffd54a', 'center', true); });
  ctx.globalAlpha = 1;
}

function shopCell(i) { return {x: 10 + (i % 3) * 117, y: 238 + Math.floor(i / 3) * 114, w: 106, h: 104}; }

function drawShop() {
  ctx.fillStyle = 'rgba(8,8,24,.55)'; ctx.fillRect(0, 0, W, H);
  txt('TRGOVINA', W / 2, 38, 26, '#fff', 'center', true);
  backBtn(); coinBadge();
  ctx.fillStyle = 'rgba(255,255,255,.1)'; rr(100, 70, 160, 100, 16); ctx.fill();
  drawCube(W / 2, 128, 52, Math.sin(t / 30) * .15, save.eq);

  TABS.forEach((tb, i) => {
    const b = {x: 10 + i * 88, y: 190, w: 82, h: 34};
    ctx.fillStyle = i === tab ? '#2ee6a6' : '#2a2a55'; rr(b.x, b.y, b.w, b.h, 10); ctx.fill();
    txt(tb[1], b.x + b.w / 2, b.y + 23, 17, i === tab ? '#10202a' : '#fff');
  });

  const cat = TABS[tab][0];
  SHOP[cat].forEach((it, i) => {
    const c = shopCell(i);
    const eq = save.eq[cat] === it.id, own = save.owned.includes(cat + ':' + it.id);
    ctx.fillStyle = 'rgba(34,34,80,.95)'; rr(c.x, c.y, c.w, c.h, 12); ctx.fill();
    if (eq) { ctx.strokeStyle = '#2ee6a6'; ctx.lineWidth = 3; rr(c.x, c.y, c.w, c.h, 12); ctx.stroke(); }
    const look = Object.assign({}, save.eq); look[cat] = it.id;
    drawCube(c.x + c.w / 2, c.y + 46, 30, 0, look);
    if (cat === 'trail' && it.id !== 'none') {
      for (let j = 0; j < 4; j++) {
        ctx.globalAlpha = .9 - j * .2;
        ctx.fillStyle = it.id === 'spark' ? '#ffe680' : it.id === 'fire' ? 'hsl(' + (10 + j * 12) + ',100%,55%)' : 'hsl(' + (j * 70) + ',95%,60%)';
        ctx.fillRect(c.x + c.w / 2 - 34 - j * 9, c.y + 42 + (j % 2) * 5, 6, 6);
      }
      ctx.globalAlpha = 1;
    }
    txt(it.name, c.x + c.w / 2, c.y + 82, 13);
    if (eq) txt('Odabrano', c.x + c.w / 2, c.y + 98, 13, '#2ee6a6');
    else if (own) txt('Kupljeno', c.x + c.w / 2, c.y + 98, 13, '#aab');
    else { drawCoin(c.x + c.w / 2 - 20, c.y + 94, 7); txt(String(it.price), c.x + c.w / 2 - 9, c.y + 99, 14, '#ffd54a', 'left'); }
  });
  if (msgT > 0) txt(msg, W / 2, 500, 20, '#ffd54a', 'center', true);
  txt('Zarađuj coine skupljajući ih u igri', W / 2, 590, 14, '#dde');
  credit(622);
}

function drawMaps() {
  ctx.fillStyle = 'rgba(8,8,24,.55)'; ctx.fillRect(0, 0, W, H);
  backBtn(); coinBadge();
  txt('ODABERI MAPU', W / 2, 80, 24, '#fff', 'center', true);
  txt('Od lakšeg do težeg', W / 2, 100, 14, '#cfd');
  MAPS.forEach((m, i) => {
    const c = mapCard(i), th = THEMES[m.cycle[0]];
    ctx.fillStyle = 'rgba(34,34,80,.95)'; rr(c.x, c.y, c.w, c.h, 14); ctx.fill();
    ctx.save(); rr(c.x + 5, c.y + 5, c.w - 10, 76, 10); ctx.clip();
    const g = ctx.createLinearGradient(0, c.y + 5, 0, c.y + 81);
    th.sky.forEach((col, k) => g.addColorStop(k / (th.sky.length - 1), col));
    ctx.fillStyle = g; ctx.fillRect(c.x, c.y, c.w, 90);
    ctx.fillStyle = th.orb.c; ctx.beginPath(); ctx.arc(c.x + c.w * .8, c.y + 24, 7, 0, 7); ctx.fill();
    drawLM(m.lm, c.x + c.w / 2 - m.cx * m.ls * .22, c.y + 76, m.ls * .22, darken(th.far, .8));
    ctx.fillStyle = th.near;
    m.mini.forEach(b => ctx.fillRect(c.x + 5 + b.x * .96, c.y + 76 - b.h, b.w * .96, b.h));
    ctx.fillStyle = th.ground; ctx.fillRect(c.x, c.y + 74, c.w, 10);
    ctx.restore();
    if (i === mapIdx) { ctx.strokeStyle = '#2ee6a6'; ctx.lineWidth = 3; rr(c.x, c.y, c.w, c.h, 14); ctx.stroke(); }
    drawCoin(c.x + c.w - 36, c.y + 18, 7); txt('x' + m.cv, c.x + c.w - 26, c.y + 23, 13, '#ffd54a', 'left', true);
    txt(m.name, c.x + c.w / 2, c.y + 102, 16, '#fff');
    txt(m.sub, c.x + 10, c.y + 119, 12, '#aab', 'left');
    txt(m.diff, c.x + c.w - 10, c.y + 119, 13, DIFFCOL[m.diff], 'right');
    const b = getBest(m.id);
    txt('Najbolji: ' + b, c.x + 10, c.y + 134, 12, '#fff', 'left');
    [10, 25, 50].forEach((need, k) => star(c.x + c.w - 52 + k * 17, c.y + 130, 7, b >= need ? '#ffd54a' : 'rgba(255,255,255,.2)'));
  });
  credit(604);
}

function themeNow() {
  if (state === 'menu' || state === 'shop' || state === 'maps') return THEMES[1];
  const c = MP().cycle;
  return THEMES[c[(level - 1) % c.length]];
}

function drawScene() {
  const th = themeNow();
  if (th !== curTheme) { prevTheme = curTheme; curTheme = th; fade = 0; }
  drawBackdrop();

  if (state === 'menu') {
    txt('CUBE', W / 2, 110, 58, '#ffd54a', 'center', true);
    txt('HOP', W / 2, 170, 58, '#ffffff', 'center', true);
    drawCube(W / 2, 265 + Math.sin(t / 15) * 10, 64, Math.sin(t / 25) * .2, save.eq);
    txt(MP().name + ' · ' + MP().diff, W / 2, 345, 20, DIFFCOL[MP().diff], 'center', true);
    txt('Najbolji rezultat: ' + getBest(MP().id), W / 2, 372, 17, '#fff', 'center', true);
    btn(B.play, 'IGRAJ'); btn(B.shop, 'TRGOVINA', '#ffd54a');
    coinBadge();
    drawSnd();
    credit(H - 18);
    return;
  }
  if (state === 'shop') { drawShop(); return; }
  if (state === 'maps') { drawMaps(); return; }

  drawPlayfield(curTheme);
  if (state !== 'ready') {
    txt(String(score), W / 2, 82, 52 + pop, '#fff', 'center', true);
    txt('Level ' + level, W / 2, 108, 18, '#fff', 'center', true);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(W / 2 - 60, 118, 120, 9, 4); ctx.fill();
    const pr = (score % LEVEL_STEP) / LEVEL_STEP;
    if (pr > 0) { ctx.fillStyle = curTheme.p1; rr(W / 2 - 60, 118, Math.max(9, 120 * pr), 9, 4); ctx.fill(); }
  }
  coinBadge();
  if (state === 'ready') {
    txt(MP().name, W / 2, 150, 38, '#fff', 'center', true);
    txt('Težina: ' + MP().diff, W / 2, 180, 18, DIFFCOL[MP().diff], 'center', true);
    txt('Pokušaj ' + (save.tries[MP().id] || 1), W / 2, 210, 16, '#fff', 'center', true);
    ctx.globalAlpha = .6 + .4 * Math.sin(t / 10);
    txt('Dodirni za skok', W / 2, 410, 24, '#fff', 'center', true);
    ctx.globalAlpha = 1;
    txt('Skupljaj coine u rupama (x' + MP().cv + ')', W / 2, 445, 16, '#fff', 'center', true);
  }
  if (banner > 0) {
    ctx.globalAlpha = Math.min(1, banner / 30);
    txt('LEVEL ' + level + '!', W / 2, 250, 48, '#ffd54a', 'center', true);
    txt('+' + (5 * MP().cv) + ' coina', W / 2, 288, 22, '#fff', 'center', true);
    ctx.globalAlpha = 1;
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(10,12,30,.82)'; rr(30, 170, 300, 270, 20); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; rr(30, 170, 300, 270, 20); ctx.stroke();
    txt('KRAJ IGRE', W / 2, 218, 34, '#fff', 'center', true);
    txt(MP().name + ' · ' + MP().diff, W / 2, 242, 15, DIFFCOL[MP().diff]);
    txt('Rezultat: ' + score + '   Level ' + level, W / 2, 275, 20);
    txt(newBest ? 'NOVI REKORD: ' + getBest(MP().id) : 'Najbolji: ' + getBest(MP().id), W / 2, 303, 20, newBest ? '#ffd54a' : '#cfd');
    drawCoin(W / 2 - 52, 336, 10); txt('+' + runCoins + ' coina', W / 2 - 36, 344, 22, '#ffd54a', 'left');
    btn(B.again, 'PONOVO'); btn(B.menu, 'MAPE', '#ffd54a');
  }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  drawScene();
  ctx.restore();
  if (flashA > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flashA + ')'; ctx.fillRect(0, 0, W, H); }
}

/* ---------- UNOS ---------- */
function press(x, y) {
  if (state === 'menu') {
    if (x < 0) startRun();
    else if (hit(x, y, B.play)) state = 'maps';
    else if (hit(x, y, B.shop)) state = 'shop';
  } else if (state === 'maps') {
    if (hit(x, y, B.back)) { state = 'menu'; return; }
    MAPS.forEach((m, i) => { if (hit(x, y, mapCard(i))) { mapIdx = i; startRun(); } });
  } else if (state === 'shop') {
    if (hit(x, y, B.back)) { state = 'menu'; return; }
    TABS.forEach((tb, i) => { if (hit(x, y, {x: 10 + i * 88, y: 190, w: 82, h: 34})) tab = i; });
    const cat = TABS[tab][0];
    SHOP[cat].forEach((it, i) => { if (hit(x, y, shopCell(i))) pick(cat, it); });
  } else if (state === 'ready' || state === 'play') {
    flap();
  } else if (state === 'over' && overT > 25) {
    if (x < 0 || hit(x, y, B.again)) startRun();
    else if (hit(x, y, B.menu)) { reset(); state = 'maps'; }
  }
}
addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  press((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
});
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); press(-1, -1); } });

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
